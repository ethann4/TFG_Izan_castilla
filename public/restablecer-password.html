<!DOCTYPE html>
<html lang="es" dir="ltr">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crear nueva contrase&ntilde;a | CDP Customs</title>
    <meta name="description" content="Crea tu nueva contrase&ntilde;a CDP Customs.">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo_cdp_transparente.png">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;700&amp;display=swap" rel="stylesheet">
    <link href="assets/css/theme.css" rel="stylesheet">
    <link href="assets/css/cdp-common.css" rel="stylesheet">
    <link href="assets/css/shop.css?v=cuenta-dashboard-1" rel="stylesheet">
  </head>

  <body class="shop-page account-page">
    <main class="main" id="top">
      <nav class="navbar navbar-expand-lg navbar-light fixed-top py-4 d-block cdp-navbar" data-navbar-on-scroll>
        <div class="container">
          <a class="navbar-brand d-inline-flex align-items-center" href="index.html">
            <img class="navbar-logo navbar-logo--tall" src="assets/img/logo_cdp_transparente.png" alt="CDP Customs">
          </a>
        </div>
      </nav>

      <section class="shop-shell account-shell">
        <div class="account-wrap">
          <a class="account-back-link" href="cuenta.html"><span data-feather="arrow-left"></span> Cancelar</a>

          <div class="customer-auth-layout">
            <section class="customer-auth-card">
              <img class="customer-auth-logo" src="assets/img/logo_cdp_transparente.png" alt="CDP Customs">
              <div class="customer-auth-heading">
                <h1>Crea tu nueva contrase&ntilde;a</h1>
                <p>Por seguridad, usa al menos 8 caracteres, una may&uacute;scula y un n&uacute;mero.</p>
              </div>

              <form class="shop-form customer-auth-form" data-reset-form novalidate>
                <div class="customer-field">
                  <label for="reset-password">Nueva contrase&ntilde;a <span class="customer-required">*</span></label>
                  <div class="customer-input customer-input--password">
                    <span data-feather="lock"></span>
                    <input id="reset-password" class="form-control cdp-form-control" type="password" name="password" placeholder="Nueva contrase&ntilde;a" minlength="8" autocomplete="new-password" required>
                    <button class="customer-password-toggle" type="button" data-password-toggle aria-label="Mostrar contrase&ntilde;a">
                      <span data-feather="eye"></span>
                    </button>
                  </div>
                </div>
                <ul class="customer-password-rules" data-password-rules>
                  <li data-rule="length"><span data-feather="circle"></span> Al menos 8 caracteres</li>
                  <li data-rule="upper"><span data-feather="circle"></span> Una may&uacute;scula</li>
                  <li data-rule="number"><span data-feather="circle"></span> Un n&uacute;mero</li>
                </ul>
                <div class="customer-field">
                  <label for="reset-password-confirm">Confirmar contrase&ntilde;a <span class="customer-required">*</span></label>
                  <div class="customer-input customer-input--password">
                    <span data-feather="lock"></span>
                    <input id="reset-password-confirm" class="form-control cdp-form-control" type="password" name="password_confirm" placeholder="Confirma la nueva contrase&ntilde;a" minlength="8" autocomplete="new-password" required>
                    <button class="customer-password-toggle" type="button" data-password-toggle aria-label="Mostrar contrase&ntilde;a">
                      <span data-feather="eye"></span>
                    </button>
                  </div>
                </div>
                <button class="btn btn-primary customer-auth-submit" type="submit">Guardar contrase&ntilde;a</button>
                <div class="shop-status" data-reset-status hidden></div>
              </form>
            </section>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="assets/js/cliente-servidor.js"></script>
    <script>
      if (window.feather) feather.replace();
      (() => {
        const form = document.querySelector("[data-reset-form]");
        const status = document.querySelector("[data-reset-status]");
        const inputPassword = document.getElementById("reset-password");
        const params = new URLSearchParams(window.location.search);
        const token = params.get("token") || "";

        const setStatus = (mensaje, tipo) => {
          if (!status) return;
          status.hidden = false;
          status.textContent = mensaje;
          status.className = `shop-status is-${tipo}`;
        };

        if (!token) {
          setStatus("Enlace no valido o expirado. Solicita uno nuevo desde 'Recuperar contrasena'.", "error");
          form.querySelector('button[type="submit"]').disabled = true;
          return;
        }

        const reglas = {
          length: (v) => v.length >= 8,
          upper: (v) => /[A-Z]/.test(v),
          number: (v) => /\d/.test(v),
        };

        const refrescarReglas = (valor) => {
          document.querySelectorAll("[data-rule]").forEach((nodo) => {
            const valido = reglas[nodo.dataset.rule]?.(valor);
            nodo.classList.toggle("is-valid", !!valido);
            const icono = nodo.querySelector("[data-feather]");
            if (icono) icono.setAttribute("data-feather", valido ? "check-circle" : "circle");
          });
          if (window.feather) feather.replace();
        };

        inputPassword?.addEventListener("input", (e) => refrescarReglas(e.currentTarget.value));

        document.querySelectorAll("[data-password-toggle]").forEach((boton) => {
          boton.addEventListener("click", () => {
            const input = boton.closest(".customer-input")?.querySelector("input");
            if (!input) return;
            input.type = input.type === "password" ? "text" : "password";
          });
        });

        form?.addEventListener("submit", async (evento) => {
          evento.preventDefault();
          if (!form.checkValidity()) { form.reportValidity(); return; }
          const password = form.elements.password.value;
          const confirm = form.elements.password_confirm.value;
          if (!Object.values(reglas).every((c) => c(password))) {
            setStatus("La contrasena debe tener al menos 8 caracteres, una mayuscula y un numero.", "error");
            return;
          }
          if (password !== confirm) {
            setStatus("Las contrasenas no coinciden. Revisa la confirmacion.", "error");
            return;
          }
          try {
            await window.CDPBackend.resetCustomerPassword(token, password);
            setStatus("Contrasena actualizada. Ya puedes iniciar sesion con la nueva.", "success");
            form.reset();
            setTimeout(() => { window.location.href = "cuenta.html"; }, 1500);
          } catch (error) {
            setStatus(error.message || "No se pudo guardar la nueva contrasena.", "error");
          }
        });
      })();
    </script>
  </body>
</html>
