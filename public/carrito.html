<!DOCTYPE html>

  <head>
    <meta charset="utf-8">

    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cesta | CDP Customs</title>
    <meta name="description" content="Cesta de compra de clientes CDP Customs.">
    <link rel="apple-touch-icon" sizes="180x180" href="assets/img/logo_cdp_transparente.png">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo_cdp_transparente.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/img/logo_cdp_transparente.png">
    <link rel="shortcut icon" type="image/x-icon" href="assets/img/logo_cdp_transparente.png">
    <meta name="theme-color" content="#000000">
    <link href="assets/css/theme.css" rel="stylesheet">

  <body class="shop-page">
    <main class="main" id="top">
      <nav class="navbar navbar-expand-lg navbar-light fixed-top py-4 d-block cdp-navbar" data-navbar-on-scroll="data-navbar-on-scroll">
        <div class="container">
          <a class="navbar-brand d-inline-flex align-items-center" href="index.html">
            <img class="navbar-logo navbar-logo--tall" src="assets/img/logo_cdp_transparente.png" alt="CDP Customs">
          </a>
          <button class="navbar-toggler collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCarrito" aria-controls="navbarCarrito" aria-expanded="false" aria-label="Abrir navegacion">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse border-top border-lg-0 mt-4 mt-lg-0" id="navbarCarrito">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item fs-3 px-2"><a class="nav-link fw-bold" href="index.html">INICIO</a></li>
              <li class="nav-item fs-3 px-2"><a class="nav-link fw-bold" href="Catalogo.html">TIENDA</a></li>
              <li class="nav-item fs-3 px-2"><a class="nav-link fw-bold" href="Creacionvirtual.html">CONFIGURADOR</a></li>
              <li class="nav-item fs-3 px-2"><a class="nav-link fw-bold" href="contacto.html">CONTACTO</a></li>
            </ul>
            <div class="cdp-navbar-actions d-flex gap-3 align-items-center">
              <div class="cdp-header-tools" aria-label="Preferencias y cuenta">
                <a class="cdp-header-icon" href="Catalogo.html#catalogo" aria-label="Buscar productos"><span data-feather="search"></span></a>
                <a class="cdp-header-icon" href="cuenta.html" aria-label="Usuario" data-customer-link><span data-feather="user"></span></a>
                <a class="cdp-header-icon active" href="carrito.html" aria-label="Carrito"><span data-feather="shopping-bag"></span><span class="cdp-cart-count">0</span></a>
              </div>
            </div>
          </div>
        </div>
      </nav>

      <section class="shop-shell">
        <div class="container">
          <div class="shop-surface">
            <div class="shop-heading">
              <div>
                <div class="cdp-section-kicker">Compra cliente</div>
                <h1>Cesta</h1>
              </div>
              <a class="btn btn-outline-primary" href="Catalogo.html">Seguir comprando</a>
            </div>

            <div class="cart-layout">
              <div>
                <div class="cart-list" data-cart-items></div>
                <div class="shop-empty" data-cart-empty hidden>
                  Tu cesta esta vacia. Anade un volante desde una ficha de producto o inicia sesion en tu cuenta.
                  <div class="mt-3 d-flex flex-wrap gap-2">
                    <a class="btn btn-primary" href="Catalogo.html">Ver catalogo</a>
                    <a class="btn btn-outline-primary" href="cuenta.html">Cuenta cliente</a>
                  </div>
                </div>
              </div>

              <aside class="cart-summary" data-cart-summary hidden>
                <div>
                  <div class="cdp-section-kicker">Resumen</div>
                  <div class="cart-summary-row">
                    <span>Productos</span>
                    <strong data-cart-quantity>0 unidad(es)</strong>
                  </div>
                </div>
                <div class="cart-summary-row">
                  <span>Total estimado</span>
                  <strong class="cart-summary-total" data-cart-total>0 EUR</strong>
                </div>
                <a class="btn btn-primary" href="contacto.html">Finalizar consulta</a>
                <button class="btn btn-outline-primary" type="button" data-cart-clear>Vaciar cesta</button>
              </aside>
            </div>
          </div>
        </div>
      </section>

    <script>feather.replace();</script>
