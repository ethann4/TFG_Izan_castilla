<!DOCTYPE html>
<html lang="es" dir="ltr">

  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Recuperar contrase&ntilde;a | CDP Customs</title>
    <meta name="description" content="Solicita un enlace para restablecer la contrase&ntilde;a de tu cuenta CDP Customs.">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/img/logo_cdp_transparente.png">
    <meta name="theme-color" content="#000000">
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Condensed:wght@300;700&amp;display=swap" rel="stylesheet">
    <link href="assets/css/theme.css" rel="stylesheet">
    <link href="assets/css/cdp-common.css" rel="stylesheet">
    <link href="assets/css/shop.css?v=cuenta-dashboard-1" rel="stylesheet">
  </head>

  <body class="shop-page account-page">
    <main class="main" id="top">
      <nav class="navbar navbar-expand-lg navbar-light fixed-top py-4 d-block cdp-navbar" data-navbar-on-scroll>
        <div class="container">
          <a class="navbar-brand d-inline-flex align-items-center" href="index.html">
            <img class="navbar-logo navbar-logo--tall" src="assets/img/logo_cdp_transparente.png" alt="CDP Customs">
          </a>
        </div>
      </nav>

      <section class="shop-shell account-shell">
        <div class="account-wrap">
          <a class="account-back-link" href="cuenta.html"><span data-feather="arrow-left"></span> Volver al inicio de sesi&oacute;n</a>

          <div class="customer-auth-layout">
            <section class="customer-auth-card">
              <img class="customer-auth-logo" src="assets/img/logo_cdp_transparente.png" alt="CDP Customs">
              <div class="customer-auth-heading">
                <h1>Recuperar contrase&ntilde;a</h1>
                <p>Te enviaremos un enlace para crear una nueva contrase&ntilde;a.</p>
              </div>

              <form class="shop-form customer-auth-form" data-forgot-form novalidate>
                <div class="customer-field">
                  <label for="forgot-email">Correo electr&oacute;nico <span class="customer-required">*</span></label>
                  <div class="customer-input">
                    <span data-feather="mail"></span>
                    <input id="forgot-email" class="form-control cdp-form-control" type="email" name="email" placeholder="tu@email.com" maxlength="160" autocomplete="email" required>
                  </div>
                </div>
                <button class="btn btn-primary customer-auth-submit" type="submit">Enviar enlace</button>
                <div class="shop-status" data-forgot-status hidden></div>
              </form>

              <p class="customer-register-prompt"><a class="customer-forgot-link" href="cuenta.html">Volver al inicio de sesi&oacute;n</a></p>
            </section>
          </div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="assets/js/cliente-servidor.js"></script>
    <script>
      if (window.feather) feather.replace();
      (() => {
        const form = document.querySelector("[data-forgot-form]");
        const status = document.querySelector("[data-forgot-status]");
        const setStatus = (mensaje, tipo) => {
          if (!status) return;
          status.hidden = false;
          status.textContent = mensaje;
          status.className = `shop-status is-${tipo}`;
        };
        form?.addEventListener("submit", async (evento) => {
          evento.preventDefault();
          if (!form.checkValidity()) { form.reportValidity(); return; }
          const email = form.elements.email.value.trim();
          try {
            await window.CDPBackend.requestPasswordReset(email);
            setStatus("Si el email esta registrado, recibiras un enlace para restablecer tu contrasena en breve.", "success");
            form.reset();
          } catch (error) {
            setStatus(error.message || "No se pudo procesar la solicitud.", "error");
          }
        });
      })();
    </script>
  </body>
</html>
